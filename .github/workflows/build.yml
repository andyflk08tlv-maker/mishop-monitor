name: Armar Mishop Monitor (Windows)

# Cada cambio en main arma el .exe en una máquina Windows de GitHub y lo deja
# en el "release" fijo llamado `latest`. El CRM descarga siempre de ahí:
# https://github.com/<cuenta>/mishop-monitor/releases/latest/download/MishopMonitor.exe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install pystray pillow pyinstaller

      - name: Construir el .exe
        run: >
          python -m PyInstaller --onefile --noconsole --name "MishopMonitor"
          --hidden-import pystray._win32
          --distpath dist --workpath build --specpath build
          mishop_monitor.py

      - name: Verificar
        shell: pwsh
        run: |
          if (!(Test-Path "dist/MishopMonitor.exe")) { throw "No se generó el .exe" }
          Get-Item dist/MishopMonitor.exe | Select-Object Name, Length

      - name: Publicar en el release "latest"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Mishop Monitor (última versión)
          body: "Instalador de Windows armado automáticamente. Descárgalo desde tu CRM para que venga vinculado a tu cuenta."
          prerelease: false
          files: dist/MishopMonitor.exe
